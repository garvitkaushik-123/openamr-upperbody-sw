# SPDX-License-Identifier: MIT
# Actuator and electrical ledger for the combined OpenAMRobot 2.0 + OpenArm v2.0 model (proposal).
#
# One entry per actuator or bus node. Every quantity is {value, unit, source, status, owner, note?}.
#   unit    SI (m, s, rad, N, N*m, A, V, kg, bit/s, Hz); "1" for ratios and counts; null for text values.
#   status  datasheet | supplier_confirmation | upstream_config | upstream_urdf | cad | measured | estimated | proposed | decision | unknown | not_applicable
#           supplier_confirmation = value confirmed in written supplier communication, not necessarily a published datasheet
#           proposed  = written in a design or owner proposal, not yet frozen
#           decision  = recorded owner decision (P-03 item, register entry)
#   unknown values are null with status unknown and a note naming what would close them.
#   Never invent a number: a value without a source is not allowed (schema + test enforce this).
#
# Owners: custodian Tushar; base and lift Evans; OpenArm Om with Adnan; approver Alex.
# This file is data only. No URDF, controller, firmware or safety logic reads it yet.
# Schema: actuator_ledger.schema.json. Test: test/test_actuator_ledger.py.
ledger_revision: 1
description: Actuator and electrical ledger for the combined model (proposal, night-shift actuator-ledger)
actuators:
- id: drive_hub_motor_left
  kind: hub_motor
